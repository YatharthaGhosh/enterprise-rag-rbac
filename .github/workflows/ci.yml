name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fast checks only: lint + the tests that need no models or index.
      # The leakage and incremental-indexing tests download models and run locally (see README).
      - run: pip install ruff pytest "qdrant-client>=1.12" "pydantic-settings>=2.4"
      - run: ruff check app ui scripts eval tests
      - run: pytest tests/test_rbac_filter.py tests/test_guardrails.py
